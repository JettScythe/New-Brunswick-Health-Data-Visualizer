[project]
name = "health-data-visualizer"
version = "0.1.0"
description = "Local-first tool for visualizing and analyzing medical lab data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
]


[project.scripts]
labviz = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
